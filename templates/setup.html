{% extends "base.html" %}
{% block title %}Set Up Admin · Aura{% endblock %}
{% block content %}
<div class="page-narrow" style="padding:0;">
    <h2>Create Admin Account</h2>
    <p style="color:var(--muted); margin-bottom:24px;">This runs once, before any admin exists.</p>
    <form method="POST" class="panel">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required autofocus>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" minlength="8" required>
        <p class="field-hint">At least 8 characters.</p>

        <button type="submit" class="btn-block">Create Account</button>
    </form>
</div>
{% endblock %}
