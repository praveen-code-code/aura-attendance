{% extends "base.html" %}
{% block title %}Admin Login · Aura{% endblock %}
{% block page_class %}-narrow{% endblock %}
{% block content %}
<div class="page-narrow" style="padding:0;">
    <h2>Admin Login</h2>
    <p style="color:var(--muted); margin-bottom:24px;">Sign in to manage students, review attendance, and view analytics.</p>
    <form method="POST" class="panel">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autofocus>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required>

        <button type="submit" class="btn-block">Log In</button>
    </form>
    <p style="margin-top:16px; color:var(--muted); font-size:0.85rem;">
        First time setting up? <a href="{{ url_for('auth.setup') }}">Create the admin account</a>.
    </p>
</div>
{% endblock %}
